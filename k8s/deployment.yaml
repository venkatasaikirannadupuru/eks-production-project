apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-production-app
  namespace: production

spec:
  replicas: 2

  selector:
    matchLabels:
      app: eks-production-app

  template:
    metadata:
      labels:
        app: eks-production-app

    spec:
      containers:
        - name: eks-production-app

          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 80

            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 80

            initialDelaySeconds: 20
            periodSeconds: 20